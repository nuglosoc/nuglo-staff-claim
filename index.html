<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nuglo Staff Claim</title><style>
:root{--bg:#f7f7f8;--card:#fff;--text:#1a1a1a;--muted:#6b6b6b;--line:#e5e5e5;--accent:#2563eb;--ok:#16a34a;--bad:#dc2626}
@media (prefers-color-scheme: light){:root:not([data-theme="light"]){--bg:#15161a;--card:#1e1f24;--text:#f0f0f0;--muted:#9a9a9a;--line:#2c2d33}}
:root[data-theme="dark"]{--bg:#15161a;--card:#1e1f24;--text:#f0f0f0;--muted:#9a9a9a;--line:#2c2d33}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
 padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:1000px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.25rem;margin:8px 0 4px}
h3{font-size:.85rem;color:var(--muted);margin:0;text-transform:uppercase;letter-spacing:.03em}
.sub{color:var(--muted);font-size:.85rem;margin-bottom:16px}

/* Icons */
.icon { width: 16px; height: 16px; vertical-align: text-bottom; margin-right: 4px; display: inline-block; stroke-width: 2.5; }
.icon-lg { width: 28px; height: 28px; color: var(--accent); stroke-width: 2; margin: 0 auto 8px auto; display: block; }

.tabs{display:flex;gap:8px;margin-bottom:16px;background:var(--card);padding:4px;border-radius:10px;border:1px solid var(--line);flex-wrap:wrap}
.subtabs{display:flex;gap:6px;margin-bottom:14px;background:var(--bg);padding:3px;border-radius:8px;border:1px solid var(--line)}
.tab{flex:1;min-width:70px;text-align:center;padding:8px;border-radius:8px;cursor:pointer;font-size:.85rem;font-weight:600;color:var(--muted)}
.subtabs .tab{padding:6px;font-size:.8rem}
.tab.active{background:var(--accent);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
label{display:block;font-size:.78rem;color:var(--muted);margin:10px 0 4px}
input,select{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:.9rem;font-family:inherit}
button{border:none;border-radius:8px;padding:10px 14px;font-weight:600;cursor:pointer;font-size:.9rem; transition: opacity 0.2s; display:inline-block; text-align:center;}
.btn-primary{background:var(--accent);color:#fff;width:100%;margin-top:14px}
.btn-primary:disabled{opacity:.6}
.tbl-scroll{overflow-x:auto; margin-top:10px;}
table{width:100%;border-collapse:collapse;margin-top:8px}
table.wide{min-width:640px}
th{text-align:left;font-size:.72rem;color:var(--muted);padding:8px 5px;font-weight:600; border-bottom:1px solid var(--line)}
td{padding:8px 5px; font-size:.85rem; border-bottom:1px solid var(--line); vertical-align:middle;}
td input,td select{padding:7px;font-size:.83rem}

/* Darkened Tap to Upload File Button */
.file-btn { background: rgba(128, 128, 128, 0.12); border: 1px dashed #9ca3af; color: var(--text); width: 100%; font-size: 0.85rem; padding: 7px; min-height: 35px; display: flex; align-items: center; justify-content: center; gap: 6px; border-radius: 6px; cursor: pointer; transition: background 0.2s; }
.file-btn:hover { background: rgba(128, 128, 128, 0.2); }

.table-total{text-align:right;font-weight:700;margin-top:10px;font-size:1.05rem}
.claim{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;background:var(--card); cursor:pointer; transition: border-color 0.2s;}
.claim:hover{border-color:var(--accent);}
.claim-top{display:flex;justify-content:space-between;gap:8px; align-items: center;}
.claim-head{display:flex;align-items:flex-start;gap:6px}
.chev{color:var(--accent);font-size:.9rem;line-height:1.3;width:14px;display:inline-block}
.claim-amt{font-weight:700;white-space:nowrap}
.claim-meta{color:var(--muted);font-size:.8rem;margin-top:2px}
.items-list{margin-top:8px;font-size:.85rem;border-top:1px solid var(--line);padding-top:6px}
.item-line{display:flex;justify-content:space-between;gap:8px;padding:2px 0}
.item-line span:first-child{color:var(--muted)}
.item-line a{color:var(--accent);margin-left:6px}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:.72rem;font-weight:600}
.badge-pending{background:#fef3c7;color:#92400e}
.badge-unpaid{background:#fee2e2;color:#991b1b}
.badge-paid{background:#dcfce7;color:#166534}
.badge-rejected{background:#f3f4f6;color:#4b5563}
.badge-admin{background:#ede9fe;color:#5b21b6}
.badge-approver{background:#e0f2fe;color:#0369a1}
.badge-staff{background:#f3f4f6;color:#4b5563}
.row-btns{display:flex;gap:8px;margin-top:10px}
.row-btns button{flex:1;padding:8px 10px;font-size:.82rem}
.btn-approve{background:var(--ok);color:#fff}
.btn-reject{background:var(--bad);color:#fff}
.btn-paid{background:var(--accent);color:#fff}
.btn-neutral{background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.btn-neutral:disabled{opacity:0.6; cursor:not-allowed;}
.empty{text-align:center;color:var(--muted);padding:24px 0;font-size:.9rem}
.note{font-size:.75rem;color:var(--muted);margin-top:4px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 10px;font-size:.85rem;margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.kv span:nth-child(odd){color:var(--muted)}
.section-head{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 8px}
.collapse-btn{background:none;border:none;color:var(--muted);font-size:.95rem;padding:2px 8px;cursor:pointer}
.toolbar{display:flex;gap:8px;align-items:stretch;margin-bottom:12px}
.toolbar .subtabs{flex:1;margin:0}
.tb-btn{width:auto;padding:6px 12px;font-size:.8rem}
.stat{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--accent);color:#fff;border-radius:14px;padding:16px;margin-bottom:12px}
.stat .lbl{font-size:.75rem;opacity:.85}
.stat .big{font-size:1.6rem;font-weight:700;line-height:1.2}
.stat .side{text-align:right;font-size:.75rem;opacity:.9;line-height:1.5}
.period{border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:10px;overflow:hidden}
.period-head{display:flex;align-items:center;gap:8px;padding:13px 12px;cursor:pointer}
.period-main{flex:1;min-width:0}
.period-label{font-weight:600}
.period-sub{color:var(--muted);font-size:.76rem;margin-top:2px}
.period-amt{font-weight:700;white-space:nowrap}
.period-body{padding:12px;border-top:1px solid var(--line);background:var(--bg)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal-box{background:var(--card);border-radius:14px;padding:16px;width:100%;max-width:680px;max-height:90vh;overflow:auto}
#loginScreen{max-width:360px;margin:12vh auto 0}
#deniedScreen{max-width:360px;margin:20vh auto 0;text-align:center}

/* Password Input Wrapper */
.pwd-wrap { position: relative; display: block; }
.pwd-wrap input { padding-right: 40px; }
.pwd-toggle { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--muted); padding: 4px; display: flex; align-items: center; justify-content: center; }
.pwd-toggle:hover { color: var(--text); }

/* Submissions & Dashboard Summary Cards Layout Standardisation */
.summary-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 20px; }
.sum-card { 
  background: var(--card); 
  border: 1px solid var(--line); 
  border-radius: 12px; 
  padding: 18px 12px; 
  text-align: center; 
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 120px;
}
.sum-card h3, .sum-card .sum-lbl { 
  margin: 6px 0 0 0; 
  color: var(--muted); 
  font-size: 0.88rem; 
  font-weight: 600; 
  text-transform: none; 
  letter-spacing: 0; 
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  width: 100%;
}
.sum-card .sum-val { 
  font-size: 1.8rem; 
  font-weight: 700; 
  line-height: 1.1; 
  color: var(--text); 
  margin: 2px 0;
}
.sum-card.clickable { cursor: pointer; transition: border-color 0.2s, transform 0.2s; }
.sum-card.clickable:hover { border-color: var(--accent); transform: translateY(-2px); }

/* Add Claim Form Grid / Scoped Styling */
.item-entry-card { background: var(--bg); padding: 12px; margin-bottom: 12px; border-radius: 8px; border: 1px solid var(--line); }
.form-group { display: flex; flex-direction: column; width: 100%; }
.form-group label { display: block; font-size: 0.75rem; font-weight: 600; color: var(--muted); margin: 0 0 4px 0; text-transform: uppercase; letter-spacing: 0.02em; }
.form-group input, .form-group select { width: 100%; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--line); font-size: 0.9rem; background: var(--card); margin: 0; box-sizing: border-box; }

/* Display helpers for responsive layout */
.desktop-only { display: inline-block; }
.mobile-only { display: none; }
.mobile-flex { display: none; }

/* Grid specific to Desktop */
@media (min-width: 769px) {
  .item-entry-grid.flex-desktop { display: flex; align-items: flex-start; gap: 10px; flex-wrap: nowrap; }
  .flex-desktop .form-group { width: auto; margin-bottom: 0; min-width: 0; }
  .flex-desktop .form-group label { margin-top: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Field Widths */
  .w-date { flex: 0 0 105px; }
  .w-desc { flex: 2 1 120px; }
  .w-purp { flex: 1.5 1 110px; }
  .w-cat  { flex: 1.2 1 100px; }
  .w-amt  { flex: 0 0 85px; }
  .w-file { flex: 0 0 130px; }
  .w-rm   { flex: 0 0 35px; display: flex; justify-content: center; }

  /* Mileage Field Widths */
  .w-route { flex: 1.6 1 130px; }
  .w-km    { flex: 0 0 75px; }

  /* Tabular Layout specific rules */
  .desktop-hidden { display: none !important; }
  .item-entry-card { margin-bottom: 6px !important; padding-bottom: 8px !important; border: none !important; border-bottom: 1px dashed var(--line) !important; border-radius: 0 !important; background: transparent !important; }
  .items-container .item-entry-card:last-child { border-bottom: none !important; }
  
  #itemsBody .item-entry-card:not(:first-child) .form-group label, #mileageBody .item-entry-card:not(:first-child) .form-group label { display: none !important; }
}

/* --- Mobile Improvements --- */
@media (max-width: 768px) {
  .desktop-only { display: none !important; }
  .mobile-only { display: inline-block !important; }
  .mobile-flex { display: flex !important; }
  
  .wrap { padding: 15px 12px 60px; }

  /* Center Admin Nav Tabs on Mobile */
  .tabs {
    justify-content: center;
    flex-wrap: nowrap;
    gap: 4px;
    padding: 4px;
  }
  .tabs .tab {
    flex: 1 1 0;
    min-width: 0;
    padding: 8px 4px;
    font-size: 0.78rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .tabs .tab .icon {
    margin-right: 3px;
    flex-shrink: 0;
  }

  .summary-cards { grid-template-columns: 1fr; gap: 12px; margin-bottom: 16px; }
  .sum-card { padding: 16px 12px; min-height: 110px; }
  .sum-card .sum-val { font-size: 1.6rem; }

  #staffHomeCards { grid-template-columns: 1fr !important; }
  
  /* Touch targets and anti-zoom */
  input, select { font-size: 16px !important; padding: 10px; } 
  button { padding: 12px 14px; font-size: 16px; }
  .subtabs .tab { padding: 8px; }
  .collapse-btn { padding: 8px 12px; }
  
  /* Fallback stacked grid for mobile */
  .item-entry-grid { display: flex; flex-direction: column; gap: 10px; }
  .w-date { max-width: none; }
  
  /* Layout wrapping for toolbars & filters */
  .toolbar { flex-direction: column; align-items: stretch; gap: 10px !important; }
  .toolbar .subtabs { width: 100%; display: flex; margin: 0 !important; }
  #adminMonthFilterWrap { flex-wrap: wrap; width: 100%; gap: 6px; }
  #adminMonthFilterWrap input { width: 100% !important; flex: none; margin-bottom: 4px !important; }
  #adminMonthFilterWrap button { flex: 1; }
  .toolbar > button.tb-btn { margin-left: 0 !important; width: 100%; }
  
  /* Modal responsive sizing */
  .modal-box { padding: 20px 16px; margin: 10px; max-height: 95vh; }
  #rm_actions { flex-direction: column; gap: 8px; }
  #rm_actions button { width: 100% !important; min-width: auto !important; margin: 0 !important; }
  
  /* Review Item Lines */
  .item-line { flex-direction: column; align-items: flex-start !important; gap: 6px; padding: 10px 0 !important; }
  .item-line > span:last-child { width: 100%; justify-content: space-between; margin-top: 4px; padding-top: 8px; border-top: 1px dashed var(--line); }
  
  /* Tables horizontally scrollable */
  .tbl-scroll { -webkit-overflow-scrolling: touch; border-right: 1px solid var(--line); border-left: 1px solid var(--line); border-radius: 4px; padding-bottom: 4px; margin-bottom: 8px; }
  td input, td select { min-width: 120px; }
  
  .claim-top { flex-wrap: wrap; align-items: flex-start; }
  .claim-top > div:last-child { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-top: 8px; flex-direction: row-reverse; }
  .kv { grid-template-columns: 80px 1fr; }
}

/* Category Drag and Drop Styles */
.cat-row { transition: opacity 0.2s; background: var(--bg); border-radius: 8px; padding: 10px; border: 1px solid var(--line); margin-bottom: 6px; }
.cat-row.dragging { opacity: 0.5; border: 1px dashed var(--accent); }
.cat-row.drag-over { border-top: 2px solid var(--accent); }
.drag-handle { cursor: grab; padding: 4px; color: var(--muted); }
.drag-handle:active { cursor: grabbing; }

/* One-line action bar: Submit left, Export and Print right */
.claim-actions{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;flex-wrap:nowrap}
.claim-actions-right{display:flex;align-items:center;gap:8px;min-width:0}
.claim-actions button{width:auto;margin:0;white-space:nowrap;padding:11px 15px;font-size:.9rem}
.claim-actions .btn-primary{min-width:110px}
/* Stronger contrast for the PDF and Print actions */
.claim-actions .btn-neutral{background:#374151;color:#ffffff;border:1px solid #374151;font-weight:700;box-shadow:0 2px 5px rgba(0,0,0,.12)}
.claim-actions .btn-neutral:hover{background:#1f2937;border-color:#1f2937}
.claim-actions .btn-neutral:focus-visible{outline:3px solid #9ca3af;outline-offset:2px}
@media(max-width:430px){.claim-actions{gap:5px}.claim-actions-right{gap:5px}.claim-actions button{font-size:.75rem;padding:10px 7px}.claim-actions .btn-primary{min-width:76px}}

<div class="wrap"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px"><div style="font-size:1.35rem;font-weight:800;letter-spacing:-.04em">NUGLO <span style="font-size:.9rem;font-weight:600;letter-spacing:0">Staff Claim</span></div><span style="font-size:.8rem;color:var(--muted)">PDF only · No login</span></div>
<div class="card"><h3>Staff Details</h3><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px 14px"><div><label>Staff Name *</label><select id="staffName" required><option value="">-- Select Staff Name --</option></select></div><div><label>Designation *</label><input id="designation" required></div></div></div>
<div class="subtabs" id="addClaimTabs"><div class="tab active" id="chooseGeneralBtn">▤ General Claim</div><div class="tab" id="chooseMileageBtn">🚗 Mileage Claim</div></div>
<div id="claims_general" style="display:none">
  <div class="card">
    <div class="form-group" style="width: auto; display: inline-block;">
      <label>Submission Date</label>
      <input id="f_subdate" type="text" disabled style="margin-bottom: 16px; background: var(--bg); max-width: 200px;">
    </div>
    
    <h4 class="desktop-only" style="margin: 0 0 8px; font-size:0.8rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.03em;">Item Details</h4>
    <div id="itemsBody" class="items-container"></div>
    <button class="add-row btn-neutral" id="addRowBtn" style="margin-top: 12px; width:100%; border:1px dashed var(--accent); color:var(--accent); background:transparent;">+ Add Item</button>
    
    <div class="table-total">Total: <span id="tableTotal">RM 0.00</span></div>
    <div class="claim-actions"><button class="btn-primary" id="submitBtn" type="button">Submit</button><div class="claim-actions-right"><button class="btn-neutral" id="exportBtn" type="button">Export as PDF</button><button class="btn-neutral" id="printBtn" type="button">Print</button></div></div>
  </div>
</div>

<div id="claims_mileage" style="display:none">
  <div class="card">
    <div class="form-group" style="width: auto; display: inline-block;">
      <label>Submission Date</label>
      <input id="mf_subdate" type="text" disabled style="margin-bottom: 16px; background: var(--bg); max-width: 200px;">
    </div>
    
    <h4 class="desktop-only" style="margin: 0 0 8px; font-size:0.8rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.03em;">Trip Details</h4>
    <div id="mileageBody" class="items-container"></div>
    <button class="add-row btn-neutral" id="addMileageRowBtn" style="margin-top: 12px; width:100%; border:1px dashed var(--accent); color:var(--accent); background:transparent;">+ Add Trip</button>
    
    <div class="table-total">Total: <span id="mileageTotal">RM 0.00</span></div>
    <div class="claim-actions"><button class="btn-primary" id="mileageSubmitBtn" type="button">Submit</button><div class="claim-actions-right"><button class="btn-neutral" id="mileageExportBtn" type="button">Export as PDF</button><button class="btn-neutral" id="mileagePrintBtn" type="button">Print</button></div></div>
  </div>
</div><p class="sub" style="margin-top:14px"></p></div><script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
const MAX_RECEIPTS=25;
// Staff names are managed centrally in settings.js.
const STAFF_NAMES = (typeof CLAIM_SETTINGS !== 'undefined' && Array.isArray(CLAIM_SETTINGS.staffNames))
  ? CLAIM_SETTINGS.staffNames : ['Amir Khalis','Aishah','Nur Syazwani','Emma Lee'];
const staffSelect = document.getElementById('staffName');
STAFF_NAMES.forEach(name => {
  const option = document.createElement('option');
  option.value = name;
  option.textContent = name;
  staffSelect.appendChild(option);
});

// Default rate is RM0.70/km. To update the rate for all staff,
// edit mileageRate in settings.js and publish both files together.
let mileageRate = (typeof CLAIM_SETTINGS !== 'undefined' && Number.isFinite(Number(CLAIM_SETTINGS.mileageRate)) && Number(CLAIM_SETTINGS.mileageRate) > 0)
  ? Number(CLAIM_SETTINGS.mileageRate) : 0.70;
function localToday(){const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');}
function enforceClaimDate(input){input.max=localToday();if(input.value>localToday()){input.value=localToday();alert('Claim date cannot be later than today.');}input.required=true;}

const CATS = ((typeof CLAIM_SETTINGS !== 'undefined' && Array.isArray(CLAIM_SETTINGS.categories)) ? CLAIM_SETTINGS.categories : ['Event/Project','Pantry','Office Use','Parking & Toll','Staff Meal','Others']).map((name,i)=>({id:'c'+i,name,is_active:true}));
function fmtDate(d){if(!d)return '';const [y,m,day]=d.split('-');return day+'/'+m+'/'+y;}
function money(n){return 'RM '+Number(n||0).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2});}
function updateTotal(body,out){let sum=0;$('#'+body).querySelectorAll('.item-entry-card').forEach(r=>{sum+=Number(r.querySelector(body==='itemsBody'?'.it-amt':'.mi-amt-display').value)||0});$('#'+out).textContent=money(sum);}
function wireUpload(div,selector,key){const input=div.querySelector(selector),btn=div.querySelector('.file-btn');btn.addEventListener('click',()=>input.click());input.addEventListener('change',async()=>{const file=input.files[0];if(!file)return;if(!file.type.startsWith('image/')){alert('Please select an image receipt.');return;}if(file.size>15*1024*1024){alert('Image must be 15 MB or smaller.');return;}try{const url=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)});const img=await new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=url});const scale=Math.min(1,1800/Math.max(img.width,img.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);div.dataset[key]=canvas.toDataURL('image/jpeg',.82);btn.textContent='✓ Attached: '+file.name.slice(0,19);btn.style.color='var(--ok)';}catch(e){alert('Could not read receipt: '+e.message)}});}
function addItemRow(data = {}){
  if($('#itemsBody').children.length >= MAX_RECEIPTS){ alert(`Maximum ${MAX_RECEIPTS} items/receipts per submission.`); return; }
  const isFirst = $('#itemsBody').children.length === 0;
  const div = document.createElement('div');
  div.className = 'item-entry-card';
  
  const activeCats = CATS.filter(c => c.is_active);
  if (data.category && !activeCats.some(c => c.name === data.category)) {
      activeCats.push({ name: data.category, is_active: false });
  }

let claimType='general';function switchType(t){claimType=t;$('#claims_general').style.display=t==='general'?'block':'none';$('#claims_mileage').style.display=t==='mileage'?'block':'none';$('#chooseGeneralBtn').classList.toggle('active',t==='general');$('#chooseMileageBtn').classList.toggle('active',t==='mileage');}
$('#chooseGeneralBtn').onclick=()=>switchType('general');$('#chooseMileageBtn').onclick=()=>switchType('mileage');
$('#addRowBtn').onclick=()=>addItemRow();$('#addMileageRowBtn').onclick=()=>addMileageRow();
function field(id){return $('#'+id).value.trim()}
function collect(){
  for(const id of ['staffName','designation']){
    if(!field(id)){alert('Please fill in '+(id==='staffName'?'Staff Name':'Designation')+'.');$('#'+id).focus();return null;}
  }
  const mileage=claimType==='mileage';
  const rows=[...(mileage?$('#mileageBody'):$('#itemsBody')).children];
  const items=[];
  for(const [index,r] of rows.entries()){
    const v=c=>r.querySelector(c).value.trim();
    const dateEl=r.querySelector(mileage?'.mi-date':'.it-date');
    enforceClaimDate(dateEl);
    if(!dateEl.value || dateEl.value>localToday()){
      alert('Item '+(index+1)+': Date must be today or earlier.');dateEl.focus();return null;
    }
    const stopInputs=[...r.querySelectorAll('.mi-stop-input')];
    if(mileage && stopInputs.some(x=>!x.value.trim())){
      alert('Trip '+(index+1)+': Please fill in every added stop or remove the empty stop.');stopInputs.find(x=>!x.value.trim()).focus();return null;
    }
    const item=mileage?{
      date:v('.mi-date'),start:v('.mi-start'),stops:stopInputs.map(x=>x.value.trim()),
      end:v('.mi-end'),purpose:v('.mi-purpose'),km:Number(v('.mi-km')),
      amount:Number(v('.mi-amt-display')),receipt:r.dataset.referencePath
    }:{
      date:v('.it-date'),merchant:v('.it-desc'),purpose:v('.it-purpose'),
      category:v('.it-cat'),amount:Number(v('.it-amt')),receipt:r.dataset.receiptPath
    };
    if(!item.receipt || !(item.amount>0) ||
       (mileage?(!item.start||!item.end||!item.purpose||!(item.km>0)):
       (!item.merchant||!item.purpose||!item.category))){
      alert('Please complete ALL columns in '+(mileage?'trip ':'item ')+(index+1)+', enter a positive amount/distance and attach a receipt.');
      return null;
    }
    items.push(item);
  }
  if(!items.length){alert('Please add at least one claim item.');return null;}
  return items;
}
function buildPDF(){const items=collect();if(!items)return null;if(!window.jspdf||!window.jspdf.jsPDF){alert('PDF library not loaded. Please connect to the internet and reopen the HTML.');return;}const {jsPDF}=window.jspdf;const pdf=new jsPDF({unit:'mm',format:'a4'});const W=210,margin=15;const accent=[45,45,45];let y=16;function page(){pdf.addPage();y=18;}function ensure(h){if(y+h>277)page();}function txt(label,value){ensure(8);pdf.setFont('helvetica','bold');pdf.setFontSize(9);pdf.setTextColor(90);pdf.text(label,margin,y);pdf.setFont('helvetica','normal');pdf.setTextColor(20);const lines=pdf.splitTextToSize(String(value||'-'),110);pdf.text(lines,78,y);y+=Math.max(7,lines.length*4.8);}pdf.setFont('helvetica','bold');pdf.setFontSize(19);pdf.setTextColor(20);pdf.text('NUGLO  |  STAFF CLAIM',margin,23);pdf.setFontSize(10);pdf.setTextColor(95);pdf.text(claimType==='general'?'GENERAL EXPENSE CLAIM':'MILEAGE CLAIM',margin,30);y=39;txt('Staff Name',field('staffName'));txt('Designation',field('designation'));txt('Submission Date',new Date().toLocaleDateString('en-GB'));if(claimType==='mileage')txt('Mileage Rate','RM '+mileageRate.toFixed(2)+'/km');y+=5;ensure(15);pdf.setFont('helvetica','bold');pdf.setTextColor(...accent);pdf.setFontSize(12);pdf.text('CLAIM DETAILS',margin,y);y+=7;const columns=claimType==='general'?[{header:'#',dataKey:'no'},{header:'Date',dataKey:'date'},{header:'Merchant',dataKey:'merchant'},{header:'Item',dataKey:'purpose'},{header:'Category',dataKey:'category'},{header:'RM',dataKey:'amount'}]:[{header:'#',dataKey:'no'},{header:'Date',dataKey:'date'},{header:'Route / Stops',dataKey:'route'},{header:'Purpose',dataKey:'purpose'},{header:'KM',dataKey:'km'},{header:'RM',dataKey:'amount'}];const data=items.map((i,n)=>claimType==='general'?{no:n+1,date:fmtDate(i.date),merchant:i.merchant,purpose:i.purpose,category:i.category,amount:i.amount.toFixed(2)}:{no:n+1,date:fmtDate(i.date),route:[i.start,...i.stops,i.end].join(' > '),purpose:i.purpose,km:i.km.toFixed(1),amount:i.amount.toFixed(2)});pdf.autoTable({startY:y,columns,body:data,theme:'striped',styles:{fontSize:8,cellPadding:2.4,overflow:'linebreak'},headStyles:{fillColor:[65,65,65],textColor:[255,255,255]},margin:{left:margin,right:margin,bottom:18},columnStyles:{amount:{halign:'right'},no:{cellWidth:8}},didDrawPage:()=>{}});y=pdf.lastAutoTable.finalY+10;ensure(16);pdf.setFillColor(242,242,242);pdf.roundedRect(margin,y,180,14,2,2,'F');pdf.setFont('helvetica','bold');pdf.setTextColor(20);pdf.setFontSize(12);pdf.text('TOTAL CLAIM',margin+5,y+9);pdf.text(money(items.reduce((a,i)=>a+i.amount,0)),190,y+9,{align:'right'});y+=23;page();pdf.setFont('helvetica','bold');pdf.setFontSize(15);pdf.setTextColor(...accent);pdf.text('RECEIPT ATTACHMENTS',margin,y);y+=10;items.forEach((item,n)=>{const props=pdf.getImageProperties(item.receipt);const ratio=props.width/props.height;const iw=Math.min(180,170*ratio);const ih=iw/ratio;const h=Math.min(ih,190);const w=h*ratio;const label=claimType==='general'?item.merchant:[item.start,...item.stops,item.end].join(' > ');const caption=pdf.splitTextToSize('Receipt '+(n+1)+' | '+fmtDate(item.date)+' | '+label+' | '+money(item.amount),180);const captionHeight=caption.length*4.5;ensure(captionHeight+Math.min(h,190)+12);pdf.setFontSize(9);pdf.setFont('helvetica','bold');pdf.setTextColor(30);pdf.text(caption,margin,y);y+=captionHeight+3;const maxH=Math.min(h,255-y);const finalW=w*maxH/h;pdf.addImage(item.receipt,'JPEG',margin,y,finalW,maxH);y+=maxH+10;});const pages=pdf.internal.getNumberOfPages();for(let p=1;p<=pages;p++){pdf.setPage(p);pdf.setFontSize(8);pdf.setTextColor(125);pdf.text('Nuglo Staff Claim  |  Claim and receipt copy',margin,289);pdf.text(p+' / '+pages,195,289,{align:'right'});}return pdf;}
function exportPDF(){const pdf=buildPDF();if(pdf)pdf.save('Nuglo_'+claimType+'_Claim_'+localToday()+'.pdf');}
function printClaim(){const pdf=buildPDF();if(!pdf)return;pdf.autoPrint();const url=URL.createObjectURL(pdf.output('blob'));const w=window.open(url,'_blank');if(!w){alert('Please allow pop-ups to print the claim.');URL.revokeObjectURL(url);}else{setTimeout(()=>URL.revokeObjectURL(url),120000);}}
// Submission uses a cross-origin HTML form and a one-time response nonce. No API key in public HTML.
let submitPending=null;
function actionButtons(){
  for (const id of ['submitBtn','mileageSubmitBtn']) {
    const btn=$('#'+id);
    btn.onclick=()=>submitClaim(btn);
  }
  $('#exportBtn').onclick=exportPDF;
  $('#mileageExportBtn').onclick=exportPDF;
  $('#printBtn').onclick=printClaim;
  $('#mileagePrintBtn').onclick=printClaim;
}
function submitClaim(button){
  const endpoint=(typeof CLAIM_SETTINGS!=='undefined'&&CLAIM_SETTINGS.submitUrl)||'';
  if(!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(endpoint)){
    alert('Submit is not configured yet. Add your deployed Google Apps Script URL to submitUrl in settings.js.');return;
  }
  if(submitPending){alert('A submission is already in progress.');return;}
  const pdf=buildPDF();if(!pdf)return;
  const pdfData=pdf.output('datauristring').split(',')[1];
  if(pdfData.length>10.7*1024*1024){alert('PDF too large to submit (maximum 8 MB). Reduce receipt image sizes.');return;}
  const nonce=Array.from(crypto.getRandomValues(new Uint8Array(20)),b=>b.toString(16).padStart(2,'0')).join('');
  const iframe=document.createElement('iframe');iframe.name='nuglo_upload_'+nonce;iframe.style.display='none';document.body.appendChild(iframe);
  const form=document.createElement('form');form.method='POST';form.action=endpoint;form.target=iframe.name;form.style.display='none';
  const params={nonce,staff:field('staffName'),claimType,filename:'Nuglo_'+claimType+'_'+localToday()+'.pdf',pdfBase64:pdfData};
  Object.entries(params).forEach(([key,value])=>{const input=document.createElement('input');input.type='hidden';input.name=key;input.value=value;form.appendChild(input);});
  document.body.appendChild(form);
  button.disabled=true;button.textContent='Submitting...';
  const cleanup=()=>{clearTimeout(submitPending.timer);window.removeEventListener('message',receive);form.remove();setTimeout(()=>iframe.remove(),1000);submitPending=null;button.disabled=false;button.textContent='Submit';};
  const receive=(event)=>{
    if(!submitPending||!event.data||event.data.type!=='NUGLO_CLAIM_SUBMISSION'||event.data.nonce!==nonce)return;
    // One-time nonce ties the response to this submission. No success is shown before server acknowledgement.
    const result=event.data;cleanup();
    if(result.ok)alert('Claim successfully saved to Google Drive. File: '+result.filename);
    else alert('Submission failed: '+(result.error||'Unknown error')+'\nYou can still use Export as PDF.');
  };
  window.addEventListener('message',receive);
  submitPending={timer:setTimeout(()=>{cleanup();alert('No confirmation from Google Drive. Please check the folder before trying again to avoid duplicate claims.');},90000)};
  try{form.submit();}catch(e){cleanup();alert('Could not send claim: '+e.message);}
}
actionButtons();
$('#f_subdate').value=new Date().toLocaleDateString('en-GB');$('#mf_subdate').value=new Date().toLocaleDateString('en-GB');addItemRow();addMileageRow();switchType('general');
